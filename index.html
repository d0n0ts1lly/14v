<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>24/7 ❤️</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div id="hearts"></div>
    <div id="stickers"></div>
    <div class="card">
      <img id="photo" src="img/1.jpg" />
      <div class="overlay">
        <div id="lyrics"></div>
      </div>
    </div>
    <div class="controls">
      <button id="play">▶ Play</button>
      <label>
        🔊
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      </label>
    </div>
    <div id="final">
      <div class="final-content">
        <div class="final-text">
          люблю тебя китык <span class="final-hearts">❤️❤️❤️</span>
        </div>
      </div>
    </div>
    <audio id="audio" src="song.mp3"></audio>
    <script src="script.js"></script>
  </body>
</html>
